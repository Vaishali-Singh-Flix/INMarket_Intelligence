  var enc=new TextEncoder(),dec=new TextDecoder(),$=function(i){return document.getElementById(i)};
  var STORE='np.gate.'+String(G.salt||'').slice(0,10);
  function b64d(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
  function b64e(u){var s='';for(var i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
  async function keyFromPw(pw){
    var base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(G.salt),iterations:G.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
  }
  async function decryptWith(key){return dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(G.iv)},key,b64d(G.ct)))}
  function open(html){document.open();document.write(html);document.close()}
  async function tryRemembered(){
    try{
      var raw=localStorage.getItem(STORE);if(!raw)return false;
      var key=await crypto.subtle.importKey('raw',b64d(raw),'AES-GCM',false,['decrypt']);
      open(await decryptWith(key));return true;
    }catch(e){try{localStorage.removeItem(STORE)}catch(x){}return false}
  }
  if(!window.crypto||!crypto.subtle){$('err').textContent='This browser cannot open the dashboard (it needs a secure https page and a current browser).';$('go').disabled=true;return}
  tryRemembered();
  $('f').addEventListener('submit',async function(ev){
    ev.preventDefault();
    var pw=$('pw').value;if(!pw)return;
    $('go').disabled=true;$('err').textContent='';$('go').textContent='Checking…';
    try{
      var key=await keyFromPw(pw),html;
      try{html=await decryptWith(key)}catch(e){$('err').textContent='Wrong password.';$('go').disabled=false;$('go').textContent='Open';$('pw').select();return}
      if($('rem').checked){try{localStorage.setItem(STORE,b64e(new Uint8Array(await crypto.subtle.exportKey('raw',key))))}catch(e){}}
